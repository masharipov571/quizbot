[phases.setup]
nixPkgs = ["python311"]
aptPkgs = [
    "libglib2.0-0",
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdbus-1-3",
    "libexpat1",
    "libfontconfig1",
    "libgbm1",
    "libgcc-s1",
    "libasound2",
    "libpangocairo-1.0-0",
    "libpango-1.0-0",
    "libcairo2",
    "libx11-6",
    "libxcomposite1",
    "libxdamage1",
    "libxext6",
    "libxfixes3",
    "libxi6",
    "libxrandr2",
    "libxrender1",
    "libxss1",
    "libxtst6"
]

[phases.build]
cmds = ["pip install -r requirements.txt", "playwright install chromium"]

[start]
cmd = "python migrate.py && python main.py"
